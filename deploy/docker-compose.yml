# Основной сервер в России: n8n, парсинг портала, данные клиентов.
#
# Запуск:  docker compose up -d
# Обновление после правки src/:  docker compose build && docker compose up -d
#
# Чего здесь НЕТ и почему: вызовов Claude API. Anthropic не отвечает
# с российских адресов, поэтому разбор документации уходит на отдельный
# зарубежный сервер. Его конфигурация — deploy/abroad/, данные клиентов
# туда не попадают, только публичная документация с портала.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Порт наружу не публикуется: база доступна только другим контейнерам.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Конвертер старых форматов Microsoft (.doc, .xls, .rtf — 39% приложенных
  # к закупкам файлов). Отдельным контейнером не по выбору: в образ n8n
  # его поставить нельзя, менеджер пакетов оттуда вырезан. Подробности —
  # в комментарии deploy/Dockerfile.
  #
  # Порт наружу не публикуется: сервис доступен только другим контейнерам.
  # Именно сетевая изоляция и заменяет ему проверку подлинности.
  converter:
    build:
      context: ..
      dockerfile: deploy/converter/Dockerfile
    restart: unless-stopped
    # Процесс-сборщик (tini) первым в контейнере. Без него node - первый
    # процесс и не убирает завершившихся потомков: 31.10.2026 под конвертером
    # висело 365 процессов gpg/gpgsm/gpgconf, оставленных LibreOffice.
    init: true
    expose:
      - '3000'
    tmpfs:
      # Пересохранение идёт через временные файлы. Держим их в памяти:
      # так они не остаются на диске после сбоя и не копятся незаметно.
      - /tmp:size=512m

  # Распознавание таблиц со сканов — Python, OpenCV и Tesseract (deploy/tables).
  # Данных клиента не видит, порт наружу не публикуется.
  tables:
    build:
      context: ..
      dockerfile: deploy/tables/Dockerfile
    restart: unless-stopped
    init: true  # то же, что у конвертера: Tesseract запускается дочерними процессами
    expose:
      - '3001'
    tmpfs:
      - /tmp:size=512m

  # Приложение: вся логика проекта. n8n вызывает его по сети, как конвертер.
  #
  # Решено 03.10.2026: логика переехала из Code-нод n8n в обычный код.
  # Причина — песочница нод (нет fetch, process, AbortController, не действует
  # NODE_EXTRA_CA_CERTS) и то, что код не попадал ни в тесты, ни в копии.
  # Подробности в комментарии deploy/app.Dockerfile.
  #
  # Порт наружу не публикуется: доступ только из docker-сети.
  app:
    build:
      context: ..
      dockerfile: deploy/app.Dockerfile
    restart: unless-stopped
    init: true  # pdftotext и распаковка архивов идут дочерними процессами
    # Лимит памяти: 14.11.2026 нехватка RAM заморозила ВЕСЬ сервер (журнал:
    # "Under memory pressure" каждые ~10 с, kernel жив, sshd/Caddy мертвы).
    # Без лимита повторение уложило бы все 7 контейнеров разом. С лимитом
    # перегруженный app перезапустится сам (restart), остальные не пострадают.
    # 2.5 ГБ: рабочий набор app ~1.9 ГБ + запас на пик очереди разбора.
    mem_limit: 2500m
    depends_on:
      converter:
        condition: service_started
    environment:
      CONVERTER_URL: http://converter:3000
      TABLES_URL: http://tables:3001
      STATE_DIR: /data/state
      CLIENTS_DIR: /data/clients
      # Запасной адрес для сообщений о сбоях. Адреса чатов лежат в файле
      # клиента, но если пропал сам файл — сообщить об этом будет некуда,
      # и поломка настроек станет полным молчанием. Этот адрес от файлов
      # клиентов не зависит.
      OWNER_CHAT_ID: ${OWNER_CHAT_ID:-}
      # Ключ модели для поиска поставщиков. Без него поиск пропускается,
      # и это видно в ответе /health — чтобы не выяснялось по пустой смете.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Зарубежный посредник. Anthropic не отвечает на российские адреса,
      # поэтому обращения к модели идут через зарубежный сервер (Сингапур).
      #
      # ЗАДАЁТСЯ ТОЛЬКО ЗДЕСЬ и действует только на вызовы модели.
      # Глобальные HTTP_PROXY/HTTPS_PROXY задавать НЕЛЬЗЯ: они подействуют
      # на все запросы, портал закупок увидит зарубежный адрес и перестанет
      # отвечать — то есть сломается основная функция сервиса.
      CLAUDE_PROXY_URL: ${CLAUDE_PROXY_URL:-}
      # Yandex Cloud (31.10.2026): поисковый API и модель для чтения страниц
      # поставщиков. Работает из России напрямую, без посредника.
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-}
      # Kimi - только для контролируемого сравнения чтения страниц поставщиков.
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_MODEL: ${KIMI_MODEL:-}
      # Порядок поиска поставщиков: пусто - сначала Claude, при отказе Яндекс;
      # yandex - Яндекс основной (03.11.2026).
      SUPPLIER_SEARCH: ${SUPPLIER_SEARCH:-}
      # Почтовый ящик на kargintech.ru для запросов КП поставщикам (Макс).
      # Вводит владелец в .env; пустые - почта выключена, очередь ждёт.
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-465}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-}
      MAIL_IMAP_PORT: ${MAIL_IMAP_PORT:-993}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-KarginTech}
    expose:
      - '3100'
    volumes:
      # Состояние дедупликации и настройки клиентов переживают перезапуск
      # и попадают в резервную копию вместе с остальными данными.
      - app_data:/data

  # Сайт kargintech.ru: главная, регистрация по приглашению, личный кабинет,
  # кабинет владельца (21.10.2026). Наружу — только через Caddy (HTTPS).
  # В томе site_data база SQLite: почта и хеши паролей клиентов, отметки,
  # расчёты. Том входит в резервную копию (deploy/backup.sh).
  site:
    build:
      context: ..
      dockerfile: deploy/site.Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      APP_URL: http://app:3100
      SITE_DB: /data/site.db
      PORT: 3200
      # Ключи магазина ЮKassa - вводит владелец в .env. Пустые - оплата на
      # сайте выключена, тариф включается вручную в кабинете владельца.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      # Имя бота без @ - для кнопки «Открыть бота» при подключении Telegram.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # Реквизиты для оферты и политики ПДн (вписывает владелец). Пока нет
      # LEGAL_READY=1, страницы помечены «на согласовании» и не индексируются.
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_INN: ${LEGAL_INN:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_READY: ${LEGAL_READY:-}
      # Вход через Google: ключи OAuth из Google Cloud Console, вводит
      # владелец в .env. Пустые - кнопки «Войти через Google» нет.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Чья лента показывается примером до стартовой настройки (тестовая
      # компания, бумага и канцтовары; только публичные данные закупок).
      SITE_DEMO_CLIENT: ${SITE_DEMO_CLIENT:-site-d8ba393a05d4}
      # 1 - регистрация без кода приглашения. По умолчанию закрыто: открывать
      # после уведомления РКН и реквизитов в оферте (решение владельца 22.10.2026).
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-}
      # Запасной чат владельца для сигналов о сбоях, если Telegram на сайте не
      # привязан (тот же, что у алертов приложения).
      OWNER_CHAT_ID: ${OWNER_CHAT_ID:-}
    expose:
      - '3200'
    volumes:
      - site_data:/data

  n8n:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      converter:
        # Намеренно service_started, а не service_healthy: LibreOffice
        # поднимается долго, и ждать его незачем — n8n нужен сразу, а на
        # неготовый конвертер воркфлоу получит явную ошибку, не тишину.
        condition: service_started
    environment:
      # --- база ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: ${DB_NAME}
      DB_POSTGRESDB_USER: ${DB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}

      # --- доступ ---
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      # Новое имя той же настройки (n8n предупреждает: WEBHOOK_URL устарела).
      # Без него Telegram получал неверный адрес, и нажатия кнопки за пять
      # дней не дошли ни разу — 20.10.2026.
      N8N_WEBHOOK_URL: https://${N8N_HOST}/
      N8N_PORT: 5678
      # Перед n8n один прокси (Caddy). Без этого защита от подбора пароля
      # видела все входы с одного адреса Caddy и закрывала вход владельцу
      # кодом 429 из-за чужих попыток (28.10.2026).
      N8N_PROXY_HOPS: 1
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow

      # Шифрование сохранённых доступов клиентов. Потеря этого ключа означает,
      # что все сохранённые доступы придётся заводить заново.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # --- ДОСТАВКА В TELEGRAM ЧЕРЕЗ ЗАРУБЕЖНОГО ПОСРЕДНИКА ---
      #
      # Измерено на сервере 09.10.2026: соединение с api.telegram.org
      # не устанавливается вовсе — curl отдаёт код 000, ни ответа, ни отказа.
      # Без посредника клиент не получает ни сообщений, ни файлов.
      #
      # ЭТО ОСОЗНАННОЕ ИСКЛЮЧЕНИЕ ИЗ ПРАВИЛА ПРОЕКТА «глобальный прокси
      # задавать нельзя». Правило касается контейнера, который ходит на портал
      # закупок: увидев зарубежный адрес, портал перестаёт отвечать. На портал
      # ходит контейнер `app`, и у него прокси НЕ задан и задаваться не должен.
      # n8n на портал не ходит вовсе — он вызывает только `app` и Telegram.
      #
      # ОПАСНОСТЬ, КОТОРУЮ НАДО ПОМНИТЬ: если в n8n когда-нибудь появится нода,
      # обращающаяся к порталу напрямую, она пойдёт через зарубежный сервер и получит
      # отказ. Выглядеть это будет как поломка портала.
      #
      # NO_PROXY обязателен: без него вызов http://app:3100 ушёл бы за рубеж
      # и не вернулся. Имена контейнеров перечислены явно.
      HTTPS_PROXY: ${TELEGRAM_PROXY_URL:-}
      HTTP_PROXY: ${TELEGRAM_PROXY_URL:-}
      # site - с 21.10.2026: n8n забирает у сайта очередь сообщений Telegram.
      NO_PROXY: app,converter,db,proxy,site,localhost,127.0.0.1,::1
      no_proxy: app,converter,db,proxy,site,localhost,127.0.0.1,::1

      # --- чистка истории ---
      # Без неё база растёт бесконечно: каждый запуск раз в 30 минут по
      # нескольким клиентам — это десятки тысяч записей в месяц.
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '720'        # часов, то есть 30 суток
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: 'all'
      EXECUTIONS_DATA_SAVE_ON_ERROR: 'all'

      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_LOG_LEVEL: info
      # Адрес конвертера. Воркфлоу берёт его отсюда, а не прописывает
      # в каждой ноде: забытая при переименовании нода тихо перестала бы
      # конвертировать, и 39% файлов стали бы нечитаемыми без единой ошибки.
      CONVERTER_URL: http://converter:3000
      # Адрес приложения, где живёт вся логика. n8n вызывает его одним
      # блоком и показывает результат — сам он ничего не считает.
      APP_URL: http://app:3100
    volumes:
      - n8n_data:/home/node/.n8n
    # Наружу не публикуем: снаружи стоит Caddy и держит HTTPS.
    expose:
      - '5678'

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
      - site
    ports:
      - '80:80'
      - '443:443'
    environment:
      N8N_HOST: ${N8N_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  n8n_data:
  app_data:
  site_data:
  caddy_data:
  caddy_config:
