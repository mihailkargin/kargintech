# Настройки посредника. Правило одно: разрешено только то, что нужно.
#
# Файл годится и для установки из репозитория Ubuntu (так и делаем —
# см. setup-abroad.sh), и для запуска в контейнере. Системные строки
# User/Group/PidFile нужны первому варианту и безвредны для второго.

# --- Служебное ------------------------------------------------------------------
# Посредник работает от своего пользователя, не от root: программа смотрит
# в интернет, и давать ей полные права на сервер незачем.
User tinyproxy
Group tinyproxy
PidFile "/run/tinyproxy/tinyproxy.pid"

Port 8888
Listen 0.0.0.0
Timeout 600

# --- Кому можно обращаться -----------------------------------------------------
# Пароль обязателен. Без него открытый посредник за сутки находят сканеры,
# и через него начинают ходить чужие люди — за ваш счёт и с вашего адреса.
# Значение заменить: логин:пароль, пароль сгенерировать openssl rand -base64 24
BasicAuth tender ЗАМЕНИТЬ_НА_СГЕНЕРИРОВАННЫЙ_ПАРОЛЬ

# --- Куда можно обращаться -----------------------------------------------------
# Только Anthropic. Если однажды воркфлоу по ошибке пошлёт сюда запрос
# к порталу закупок или к таблицам клиента, он не пройдёт — а не уйдёт молча
# наружу с зарубежного адреса.
ConnectPort 443
# Кто может подключаться: setup-abroad.sh заменяет эту строку на две -
# 127.0.0.1 (его же проверки) и адрес основного сервера (04.11.2026). Третий
# рубеж к паролю и сетевому экрану: на сервере с VPN экран может быть выключен.
Allow 0.0.0.0/0
FilterURLs Off
FilterDefaultDeny Yes
# Путь обязан быть В КАВЫЧКАХ. Без них tinyproxy 1.11 отказывается читать
# файл настроек целиком: «Syntax error on line …, unable to parse config file».
# Проверено на сервере 02.10.2026 — посредник просто не запустился.
Filter "/etc/tinyproxy/allowed.txt"

# --- Следы -----------------------------------------------------------------------
# Заголовки, по которым видно, что запрос шёл через посредника, убираем:
# они не нужны Anthropic и лишний раз описывают нашу схему.
DisableViaHeader Yes
XTinyproxy No

LogLevel Warning
MaxClients 20
