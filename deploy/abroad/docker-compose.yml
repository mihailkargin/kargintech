# Вспомогательный сервер за рубежом. Единственная задача — пропускать запросы
# к Claude API, потому что Anthropic не отвечает на российские адреса.
#
# Запуск:  docker compose up -d
#
# ЧТО ЗДЕСЬ ПРОИСХОДИТ И ЧЕГО НЕ ПРОИСХОДИТ.
# Это посредник, а не обработчик. Он не хранит ничего: ни данных клиентов,
# ни переписки, ни ответов модели. Через него проходит только текст публичной
# документации с zakupki.gov.ru — то, что заказчик и так опубликовал открыто.
# Прайс-листы, номенклатура и маржа клиента сюда не попадают физически:
# в запрос к модели они не кладутся (см. белый список полей в src/extract.js).
#
# Это и есть ответ на вопрос клиента «куда вы отправляете нашу документацию».

services:
  proxy:
    image: vimagick/tinyproxy
    restart: unless-stopped
    ports:
      # Наружу смотрит только этот порт, и только для нашего российского
      # сервера — остальное закрывает сетевой экран, см. setup-abroad.sh.
      - '8888:8888'
    volumes:
      - ./tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      # Список разрешённых адресов обязан попасть внутрь контейнера.
      # Найдено 02.10.2026 при перечитывании: конфиг на него ссылался
      # (строка Filter), а сам файл не передавался — то есть фильтр
      # не работал бы наверняка, а не «возможно». Ровно тот случай,
      # когда защита существует только на бумаге.
      - ./allowed.txt:/etc/tinyproxy/allowed.txt:ro
    logging:
      # Логи посредника не хранятся дольше суток: в них попадают адреса
      # запросов, а хранить лишнее в этом проекте незачем.
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
